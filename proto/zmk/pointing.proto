// Pointing subsystem messages for ZMK Studio
syntax = "proto3";
package zmk.pointing;
message SensitivityScale {
    uint32 numerator = 1;
    uint32 denominator = 2;
}
message SetSensitivityRequest {
    SensitivityScale cursor = 1;
    SensitivityScale scroll = 2;
    uint32 cpi = 3;
}
enum SetSensitivityErrorCode {
    SET_SENSITIVITY_ERR_OK = 0;
    SET_SENSITIVITY_ERR_UNSUPPORTED = 1;
    SET_SENSITIVITY_ERR_INVALID = 2;
    SET_SENSITIVITY_ERR_STORAGE = 3;
}
message SetSensitivityResponse {
    oneof result {
        bool ok = 1;
        SetSensitivityErrorCode err = 2;
    }
}
message GetSensitivityRequest {
}
message GetSensitivityResponse {
    SensitivityScale cursor = 1;
    SensitivityScale scroll = 2;
    uint32 cpi = 3;
}
// Auto Mouse Layer (AML) messages
message GetAutoLayerRequest {
}
message GetAutoLayerResponse {
    bool enabled = 1;
    uint32 require_prior_idle_ms = 2;
    repeated uint32 excluded_positions = 3;
    uint32 motion_threshold = 4;
}
enum SetAutoLayerErrorCode {
    SET_AUTO_LAYER_ERR_OK = 0;
    SET_AUTO_LAYER_ERR_UNSUPPORTED = 1;
    SET_AUTO_LAYER_ERR_STORAGE = 2;
}
message SetAutoLayerRequest {
    bool enabled = 1;
    uint32 require_prior_idle_ms = 2;
    repeated uint32 excluded_positions = 3;
    uint32 motion_threshold = 4;
}
message SetAutoLayerResponse {
    oneof result {
        bool ok = 1;
        SetAutoLayerErrorCode err = 2;
    }
}
// Precision mode scale: applied to X/Y pointer movement when the
// precision layer is active. numerator/denominator < 1 slows the cursor.
message SetPrecisionScaleRequest {
    SensitivityScale precision = 1;
}
enum SetPrecisionScaleErrorCode {
    SET_PRECISION_SCALE_ERR_OK = 0;
    SET_PRECISION_SCALE_ERR_INVALID = 1;
    SET_PRECISION_SCALE_ERR_STORAGE = 2;
}
message SetPrecisionScaleResponse {
    oneof result {
        bool ok = 1;
        SetPrecisionScaleErrorCode err = 2;
    }
}
message GetPrecisionScaleRequest {
}
message GetPrecisionScaleResponse {
    SensitivityScale precision = 1;
}
message Request {
    oneof request_type {
        SetSensitivityRequest set_sensitivity = 1;
        GetSensitivityRequest get_sensitivity = 2;
        GetAutoLayerRequest get_auto_layer = 3;
        SetAutoLayerRequest set_auto_layer = 4;
        SetPrecisionScaleRequest set_precision_scale = 5;
        GetPrecisionScaleRequest get_precision_scale = 6;
    }
}
message Response {
    oneof response_type {
        SetSensitivityResponse set_sensitivity = 1;
        GetSensitivityResponse get_sensitivity = 2;
        GetAutoLayerResponse get_auto_layer = 3;
        SetAutoLayerResponse set_auto_layer = 4;
        SetPrecisionScaleResponse set_precision_scale = 5;
        GetPrecisionScaleResponse get_precision_scale = 6;
    }
}
message Notification {
}
