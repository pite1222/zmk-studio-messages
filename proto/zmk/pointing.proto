// Pointing subsystem messages for ZMK Studio
syntax = "proto3";
package zmk.pointing;
message SensitivityScale {
    uint32 numerator = 1;
    uint32 denominator = 2;
}
message SetSensitivityRequest {
    SensitivityScale cursor = 1;
    SensitivityScale scroll = 2;
    uint32 cpi = 3;
}
enum SetSensitivityErrorCode {
    SET_SENSITIVITY_ERR_OK = 0;
    SET_SENSITIVITY_ERR_UNSUPPORTED = 1;
    SET_SENSITIVITY_ERR_INVALID = 2;
    SET_SENSITIVITY_ERR_STORAGE = 3;
}
message SetSensitivityResponse {
    oneof result {
        bool ok = 1;
        SetSensitivityErrorCode err = 2;
    }
}
message GetSensitivityRequest {
}
message GetSensitivityResponse {
    SensitivityScale cursor = 1;
    SensitivityScale scroll = 2;
    uint32 cpi = 3;
}
// Auto Mouse Layer (AML) messages
message GetAutoLayerRequest {
}
message GetAutoLayerResponse {
    bool enabled = 1;
    uint32 require_prior_idle_ms = 2;
    repeated uint32 excluded_positions = 3;
    uint32 motion_threshold = 4;
    uint32 deactivate_timeout_ms = 5; // ms of no motion before AML auto-deactivates (0 = firmware default)
}
enum SetAutoLayerErrorCode {
    SET_AUTO_LAYER_ERR_OK = 0;
    SET_AUTO_LAYER_ERR_UNSUPPORTED = 1;
    SET_AUTO_LAYER_ERR_STORAGE = 2;
}
message SetAutoLayerRequest {
    bool enabled = 1;
    uint32 require_prior_idle_ms = 2;
    repeated uint32 excluded_positions = 3;
    uint32 motion_threshold = 4;
    uint32 deactivate_timeout_ms = 5; // ms of no motion before AML auto-deactivates (0 = firmware default)
}
message SetAutoLayerResponse {
    oneof result {
        bool ok = 1;
        SetAutoLayerErrorCode err = 2;
    }
}
// Precision mode scale: applied to X/Y pointer movement when the
// precision layer is active. numerator/denominator < 1 slows the cursor.
message SetPrecisionScaleRequest {
    SensitivityScale precision = 1;
}
enum SetPrecisionScaleErrorCode {
    SET_PRECISION_SCALE_ERR_OK = 0;
    SET_PRECISION_SCALE_ERR_INVALID = 1;
    SET_PRECISION_SCALE_ERR_STORAGE = 2;
}
message SetPrecisionScaleResponse {
    oneof result {
        bool ok = 1;
        SetPrecisionScaleErrorCode err = 2;
    }
}
message GetPrecisionScaleRequest {
}
message GetPrecisionScaleResponse {
    SensitivityScale precision = 1;
}
// Pointer acceleration: speed-dependent cursor gain. The gain ramps from 1.0x
// up to (max_milli/1000)x as per-poll movement magnitude crosses `threshold`,
// reaching the max after `range` additional counts/poll. enabled=false => linear.
// Low-speed zone: below `slow_range` counts/poll the gain ramps from
// (min_milli/1000)x to 1.0x — below 1000 decelerates slow movements for fine
// pointing, above 1000 boosts them for a lighter feel. min_milli 0 or 1000 =
// zone disabled (pre-0.6.10 behavior).
message AccelConfig {
    bool enabled = 1;
    uint32 max_milli = 2;   // max gain x1000 (2000 = 2.0x)
    uint32 threshold = 3;   // counts/poll where acceleration starts
    uint32 range = 4;       // counts/poll span to reach max gain
    uint32 min_milli = 5;   // low-speed gain x1000 (700 = 0.7x, 1500 = 1.5x); 0 = keep current
    uint32 slow_range = 6;  // counts/poll span of the min->1.0x ramp; 0 = keep current
}
message SetAccelRequest {
    AccelConfig accel = 1;
}
message SetAccelResponse {
    oneof result {
        bool ok = 1;
        SetSensitivityErrorCode err = 2;
    }
}
message GetAccelRequest {
}
message GetAccelResponse {
    AccelConfig accel = 1;
}
// Host-independent key auto-repeat (typematic). When enabled, a held
// non-modifier keyboard-page key is re-sent as discrete release/press report
// pairs after delay_ms and then every interval_ms.
message KeyRepeatConfig {
    bool enabled = 1;
    uint32 delay_ms = 2;    // 0 = firmware default
    uint32 interval_ms = 3; // 0 = firmware default
}
message SetKeyRepeatRequest {
    KeyRepeatConfig config = 1;
}
message SetKeyRepeatResponse {
    oneof result {
        bool ok = 1;
        SetSensitivityErrorCode err = 2;
    }
}
message GetKeyRepeatRequest {
}
message GetKeyRepeatResponse {
    KeyRepeatConfig config = 1;
}
message Request {
    oneof request_type {
        SetSensitivityRequest set_sensitivity = 1;
        GetSensitivityRequest get_sensitivity = 2;
        GetAutoLayerRequest get_auto_layer = 3;
        SetAutoLayerRequest set_auto_layer = 4;
        SetPrecisionScaleRequest set_precision_scale = 5;
        GetPrecisionScaleRequest get_precision_scale = 6;
        SetAccelRequest set_accel = 7;
        GetAccelRequest get_accel = 8;
        SetKeyRepeatRequest set_key_repeat = 9;
        GetKeyRepeatRequest get_key_repeat = 10;
    }
}
message Response {
    oneof response_type {
        SetSensitivityResponse set_sensitivity = 1;
        GetSensitivityResponse get_sensitivity = 2;
        GetAutoLayerResponse get_auto_layer = 3;
        SetAutoLayerResponse set_auto_layer = 4;
        SetPrecisionScaleResponse set_precision_scale = 5;
        GetPrecisionScaleResponse get_precision_scale = 6;
        SetAccelResponse set_accel = 7;
        GetAccelResponse get_accel = 8;
        SetKeyRepeatResponse set_key_repeat = 9;
        GetKeyRepeatResponse get_key_repeat = 10;
    }
}
message Notification {
}
